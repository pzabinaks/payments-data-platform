models:
  - name: dim_customers
    description: "Customers dimetion table"
    columns: 
      - name: customer_sk
        description: "Primary key of dim_customer"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer_id from source"     
      - name: name
        description: "Customers name"    
      - name: email
        description: "Customers e-mail" 
      - name: country
        description: "Customers country code" 
      - name: created_at
        description: "Date when customer created"         
      - name: country_name
        description: "Customers country name"           
        data_tests:
          - not_null   

  - name: dim_mandates
    description: "Mandates dimetion table"
    columns: 
      - name: mandate_sk
        description: "Primary key of dim_mandates"
        data_tests:
          - unique
          - not_null
      - name: mandate_id
        description: "Mandate id from source" 
      - name: customer_id
        description: "Customer_id from source" 
      - name: merchant_id
        description: "Merchant_id from source" 
      - name: merchant_id
        description: "Scheme - sepa_core/bacs" 
      - name: merchant_id
        description: "Currency of mandate" 
      - name: status
        description: "Status - active/cancelled" 
      - name: created_at
        description: "Mandates creation date" 
      - name: cancelled_at
        description: "Mandates cancellation date"
      - name: is_active 
        description: "Flag: 0 -  mandate cancelled, 1 - active mandate"

  - name: dim_merchants
    description: "Merchants dimetion table"  
    columns: 
      - name: merchant_sk
        description: "Primary key of dim_merchants"
        data_tests:
          - unique
          - not_null
      - name: merchant_id
        description: "Merchant_id from source"      
      - name: name
        description: "Name of merchant"   
      - name: category
        description: "Category of merchant: gym,insurance,media,saas,telecom,utilities"   
      - name: country
        description: "Merchants country code" 
      - name: country_name
        description: "Merchants country name" 
        data_tests:
          - not_null  

  - name: dim_dates
    description: "Dates dimetion table"
    columns: 
      - name: date_sk
        description: "Primary key of dim_dates"
        data_tests:
          - unique
          - not_null
      - name: calendar_date
        description: "Calendar date"
      - name: month
        description: "Month as number"
      - name: year
        description: "Year"
      - name: quarter
        description: "Quarter: 1-4"
      - name: day_in_week
        description: "Day in a week. First day Monday"
      - name: weekend_day
        description: "Is it weekends day"
      - name: month_name
        description: "Name of the month"
      - name: year_month
        description: "YEARand month in format YYYYMM as integer"

  - name: fct_payments
    description: "Payments fact table"
    config:
      materialized: table
      partition_by:
        field: charge_date
        data_type: date # Change to 'timestamp' or 'datetime' if charge_date is not a DATE
        granularity: month
      cluster_by:
        - merchant_id
    columns:
      - name: payment_sk
        description: "Payment fact table PK"
        data_tests:
          - unique
          - not_null        
      - name: payment_id
        description: "Payments natural id"          
      - name: charge_date
        description: "Payment date - DATE"                 
      - name: charge_date_sk
        description: "FK to dim_date for charge_date"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk            
      - name: customer_sk
        description: "FK to dim_customer"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')      
                field: customer_sk         
      - name: merchant_sk
        description: "FK to dim_merchant"  
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_merchants')      
                field: merchant_sk          
      - name: mandate_sk
        description: "FK to dim_mandate"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_mandates')      
                field: mandate_sk          
      - name: merchant_id      
        description: "Natural key of merchant - clustered column!"          
      - name: submitted_date_sk
        description: "FK to dim_date for date when payment was submitted" 
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk          
      - name: confirmed_date_sk
        description: "FK to dim_date for date when payment was confirmed" 
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk 
      - name: paid_out_date_sk
        description: "FK to dim_date for date when payment was paid out" 
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk 
      - name: failed_date_sk
        description: "FK to dim_date for date when payment failed"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk 
      - name: charged_back_date_sk
        description: "FK to dim_date for date when payment was charged back"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk 
      - name: pending_submission_date_sk
        description: "FK to dim_date for date when payment was put on pending submission"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')      
                field: date_sk 
      - name: amount
        description: "Amount of payment"
      - name: status
        description: "Status of payment"
      - name: failure_reason
        description: "Failure reason of payment"
      - name: is_failed
        description: "Flag is payment failed or not"
      - name: charged_back_at
        description: "Flag is payment charged back"
      - name: charged_back_at
        description: "Flag is payment charged back"
      - name: days_to_payout
        description: "Calendare days between paid_out_at and submitted_at"
      - name: days_to_charge_back
        description: "Calendar days between charged_back_at and paid_out_at"
      - name: currency
        description: "Currency code for payment"

  - name: fct_payment_events
    description: "Fact table for payment events"
    columns: 
      - name: event_sk
        description: "Primary key of fct_payment_events"
        data_tests:
          - unique
          - not_null
      - name: calendar_date
        description: "Calendar date"            
      - name: event_id
        description: "Event id from source"   
      - name: payment_id
        description: "Payment id from source"   
      - name: payment_id
        description: "Payment id from source"   
      - name: payment_sk
        description: "FK to dim_payments"   
      - name: date_sk
        description: "FK to dim_dates for event_at"           
      - name: event_at
        description: "Timestamp for event" 
      - name: status
        description: "Events status" 
      - name: customer_sk
        description: "FK to dim_customers" 
      - name: merchant_sk
        description: "FK to dim_merchants" 
      - name: mandate_sk
        description: "FK to dim_mandates"