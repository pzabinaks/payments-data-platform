models:
  - name: stg_customers
    columns: 
      - name: customer_id
        data_tests:
          - unique
          - not_null
  - name: stg_events
    columns:    
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: payment_id
        data_tests:
          - relationships:
              field: payment_id 
              to: ref('stg_payments')          
  - name: stg_mandates
    columns: 
      - name: mandate_id
        data_tests:
          - unique
          - not_null
      - name: scheme
        data_tests:
          - accepted_values:
              values:              
                - sepa_core
                - bacs
      - name: customer_id
        data_tests:
          - relationships:
              field: customer_id 
              to: ref('stg_customers')
      - name: merchant_id
        data_tests:
          - relationships:
              field: merchant_id 
              to: ref('stg_merchants')                          
  - name: stg_merchants
    columns: 
      - name: merchant_id
        data_tests:
          - unique
          - not_null
  - name: stg_payments
    columns: 
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values:              
                - paid_out
                - failed
                - confirmed
                - charged_back
                - submitted           
      - name: currency
        data_tests:
          - accepted_values:
              values:              
                - EUR
                - GBP
      - name: mandate_id
        data_tests:
          - relationships:
              field: mandate_id 
              to: ref('stg_mandates')            