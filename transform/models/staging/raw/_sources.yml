sources:
  - name: raw
    description: "Raw data source for staging"
    database: payments-data-platform-pz01126  
    schema: raw
    tables:
      - name: customers
        description: 'Source table holding customer data'
      - name: merchants
        description: 'Source table holding merchant data'
      - name: mandates
        description: 'Source table holding mandates data'
      - name: payments
        description: 'Source table holding payments data'
      - name: events
        description: 'Source table holding payment events data'
        config:
          loaded_at_field: event_at 
          freshness:
            warn_after: { count: 24, period: hour }
            error_after: { count: 24, period: day }        