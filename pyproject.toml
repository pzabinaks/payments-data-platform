[project]
name = "payments-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow<26",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "urllib3>=2.8.0",
]

[project.scripts]
payments-data-platform = "payments_data_platform:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]   # style errors, real bugs, import order, common pitfalls

[tool.pytest.ini_options]
testpaths = ["tests"]
